[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spec-writer"
version = "2.0.0a1"
description = "Agent-driven specification compiler: layered, validated, traceable spec corpora for AI code generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "d0ubLeit" }]
keywords = [
    "specifications",
    "requirements",
    "ai-agents",
    "llm",
    "claude",
    "langgraph",
    "mcp",
    "code-generation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "claude-agent-sdk>=0.1.81,<0.2",
    "mcp>=1.20,<2",
    "langgraph>=1.0,<2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "unidecode>=1.3",
    "typer>=0.12",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "syrupy>=4.6",
    "pyright>=1.1.380",
    "ruff>=0.6",
    "coverage[toml]>=7.6",
]

[project.scripts]
spec-writer = "spec_writer.interface.batch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_writer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast isolated tests",
    "integration: multi-module tests with recorded fixtures",
    "smoke: real LLM tests (slow, costs tokens, opt-in)",
    "slow: tests > 1s",
]
addopts = "-m 'not smoke' --strict-markers"

[tool.pyright]
include = ["src/spec_writer"]
exclude = ["**/__pycache__", "**/.venv"]
strict = [
    "src/spec_writer/engine",
    "src/spec_writer/agent",
    "src/spec_writer/methodology",
    "src/spec_writer/io",
    "src/spec_writer/types.py",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = "warning"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # allow assert False in tests
# typer's idiomatic typer.Option() calls in function defaults trip B008.
"src/spec_writer/interface/batch/**" = ["B008"]

[tool.coverage.run]
branch = true
source = ["src/spec_writer"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
